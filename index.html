<script>
(function () {
  // Data atual exibida dinamicamente
  var dateEl = document.getElementById('scarcity-date');
  function formatDate(d) {
    var dd = String(d.getDate()).padStart(2, '0');
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var yyyy = d.getFullYear();
    return dd + '/' + mm + '/' + yyyy;
  }
  function updateDate() {
    dateEl.textContent = formatDate(new Date());
  }
  updateDate();
  setInterval(updateDate, 60 * 1000);
})();
</script>

<!-- Liberação do CTA sincronizada com o vídeo (26 min) -->
<script>
    /* =====================================================================
       LIBERAÇÃO DO CTA — SINCRONIZADO COM O VÍDEO (VTurb / smartplayer)
       ---------------------------------------------------------------------
       Os elementos com a classe ".esconder" começam ocultos e são exibidos
       quando o vídeo passa de SECONDS_TO_DISPLAY segundos.
       >> Ajuste apenas SECONDS_TO_DISPLAY (em segundos). Ex.: 1560 = 26 min.
       >> Se NÃO houver player na página, libera após FALLBACK_NO_PLAYER_SECONDS.
       ===================================================================== */
    var SECONDS_TO_DISPLAY = 1560;
    var FALLBACK_NO_PLAYER_SECONDS = 1560;
    (function liberarBotoes() {
      var revelado = false, elapsed = 0;
      function mostrar() {
        if (revelado) return;
        revelado = true;
        document.querySelectorAll('.esconder').forEach(function (el) { el.classList.remove('esconder'); });
      }
      var timer = setInterval(function () {
        elapsed += 1;
        var sp = (typeof smartplayer !== 'undefined' && smartplayer.instances && smartplayer.instances[0] && smartplayer.instances[0].video) ? smartplayer.instances[0].video : null;
        if (sp) {
          if (sp.currentTime > SECONDS_TO_DISPLAY) { mostrar(); clearInterval(timer); }
        } else if (elapsed >= FALLBACK_NO_PLAYER_SECONDS) {
          mostrar(); clearInterval(timer);
        }
      }, 1000);
    })();
</script>
